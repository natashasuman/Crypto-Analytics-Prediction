[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptocast"
version = "0.1.0"
description = "Automated Crypto Forecasting Platform with DAG orchestration, drift monitoring, and self-healing pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Natasha Suman" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "optuna>=3.6.0",
    "mlflow>=2.12.0",
    "scipy>=1.13.0",
]
sentiment = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "nltk>=3.8.0",
]
orchestration = [
    "prefect>=2.19.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
cryptocast = "cryptocast.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -p no:cacheprovider -p no:cov"

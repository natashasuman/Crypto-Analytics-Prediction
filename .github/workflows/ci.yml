name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run Ruff Lint
        run: |
          uv run ruff check src tests

      - name: Run Mypy Type Check
        run: |
          uv run mypy src

      - name: Run Unit Tests with Coverage
        run: |
          uv run pytest --cov=src/cryptocast --cov-report=term-missing tests/unit
